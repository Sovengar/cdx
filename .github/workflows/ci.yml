name: CI

# NOTE: this workflow intentionally has NO `paths` / `paths-ignore` filters.
# A path-filtered push/PR skips the workflow entirely; a skipped workflow leaves
# its required status checks stuck in "pending" forever, which deadlocks every
# PR that does not touch the filtered paths. The gates run on every change.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous
# check run. The default branch (master) is exempt: every commit landing there
# gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  Build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: make build

  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Warnings are errors: the gate must not silently accumulate lint debt.
      # `cargo fmt --check` is deliberately NOT part of the gate yet (an
      # available future add-on, mirroring vroom's single-linter choice).
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `execute_search` shells out to `rg` (ripgrep): src/search/mod.rs (4 call
      # sites), src/tui/grep.rs and src/preview/commands.rs all spawn it, and the
      # grep.rs integration tests assert real matches. The ubuntu runner ships no
      # ripgrep, so we provide a pinned static musl build (no libc/apt needed) for
      # parity with the documented local environment (README "Runtime: rg").
      # The binary is cached, so download + checksum only run on a cache miss.
      - name: Restore cached ripgrep
        id: rg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rg-bin
          # Pinned version + runner arch. Deliberately NO `restore-keys`: a pinned
          # tool must never silently fall back to a different version.
          key: ripgrep-15.2.0-x86_64-unknown-linux-musl
      - name: Download ripgrep (cache miss)
        if: steps.rg-cache.outputs.cache-hit != 'true'
        env:
          RG_VERSION: 15.2.0
        run: |
          set -euo pipefail
          asset="ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL -o "$tmp/$asset" "$base/$asset"
          curl -fsSL -o "$tmp/$asset.sha256" "$base/$asset.sha256"
          # Integrity: ripgrep publishes a .sha256 per asset. Fail loudly on a
          # mismatch rather than shipping a corrupted/foreign binary.
          (cd "$tmp" && sha256sum -c "$asset.sha256") || {
            echo "ERROR: sha256 mismatch for $asset" >&2
            exit 1
          }
          tar -xzf "$tmp/$asset" -C "$tmp"
          mkdir -p "$HOME/.cache/rg-bin"
          install -m 0755 "$tmp/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" \
            "$HOME/.cache/rg-bin/rg"
      - name: Put ripgrep on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/.cache/rg-bin/rg" "$HOME/.local/bin/rg"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          command -v rg || {
            echo "ERROR: no working rg after cache restore/download" >&2
            exit 1
          }
          rg --version
      - name: Test
        run: make test
