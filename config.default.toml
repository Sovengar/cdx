# cdx configuration file
# See https://github.com/Sovengar/cdx for docs

# Display defaults
show_dotfiles = false
show_winhidden = false
popup_width_pct = 80
popup_height_pct = 80

# Zoxide
zoxide_limit = 5

# Timing (milliseconds)
grep_debounce_ms = 80
find_debounce_ms = 50

# Search
grep_max_depth = 5

# Walker
priority_roots = ["dev", ".config"]
max_priority_depth = 6
max_secondary_depth = 5

exclude_dirs = [
    "node_modules", ".git", ".cache", "cache",
    "licenses", "vendor", "target", "build",
    "dist", "Modules", "modules", "lib", "platform",
]

exclude_win_dirs = ["AppData", "ProgramData"]
exclude_path_globs = ["**/go/pkg/mod"]

[keys]
quit = "ctrl+c"
toggle_dotfiles = "ctrl+h"
toggle_winhidden = "ctrl+w"
open_settings = "ctrl+e"
switch_mode = "tab"
open_explorer = "ctrl+o"

# Tool selector (Ctrl+Enter on a directory)
# Each entry needs a display name and the command to run.
# Order in this list = order in the popup.
[[tool_selector]]
name = "yazi"
command = "yazi"

[[tool_selector]]
name = "nvim"
command = "nvim"

[[tool_selector]]
name = "opencode"
command = "opencode"

[[tool_selector]]
name = "lazygit"
command = "lazygit"
